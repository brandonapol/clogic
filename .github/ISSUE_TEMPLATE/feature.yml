name: Feature
description: A user-facing capability or improvement.
labels: [feature]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a producer mixing in Logic, I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable conditions. Agents work from these.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: research
    attributes:
      label: Related research
      description: Spikes or decision records this depends on.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
